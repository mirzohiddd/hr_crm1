<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 760" role="img" aria-label="Ofisda xodimlarni o‘qitish: murabbiy doskada mavzuni tushuntirmoqda">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3F7FF"/>
      <stop offset="1" stop-color="#E3EDFD"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D6E4FB"/>
      <stop offset="1" stop-color="#C3D6F7"/>
    </linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DBEAFE"/>
      <stop offset="1" stop-color="#BFDBFE"/>
    </linearGradient>
    <linearGradient id="blazer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E40AF"/>
      <stop offset="1" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="shirtA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="shirtB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEF3FB"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#94A3B8"/>
      <stop offset="1" stop-color="#64748B"/>
    </linearGradient>
    <radialGradient id="light" cx="0.8" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#1E3A8A" flood-opacity="0.16"/>
    </filter>
    <filter id="softSm" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#1E3A8A" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Xona -->
  <rect width="640" height="760" fill="url(#wall)"/>
  <rect y="560" width="640" height="200" fill="url(#floor)"/>
  <rect y="556" width="640" height="6" fill="#C7D7F3"/>
  <rect width="640" height="760" fill="url(#light)"/>

  <!-- Deraza -->
  <g transform="translate(430 70)">
    <rect width="170" height="220" rx="10" fill="#FFFFFF" filter="url(#softSm)"/>
    <rect x="10" y="10" width="150" height="200" rx="6" fill="url(#win)"/>
    <rect x="83" y="10" width="4" height="200" fill="#FFFFFF"/>
    <rect x="10" y="108" width="150" height="4" fill="#FFFFFF"/>
    <!-- shahar silueti -->
    <path d="M10 210 V170 h22 v-26 h18 v40 h16 v-58 h20 v44 h14 v-30 h24 v50 h16 v-20 h20 v40 z" fill="#93C5FD" opacity="0.55"/>
    <circle cx="128" cy="48" r="16" fill="#FFFFFF" opacity="0.8"/>
  </g>

  <!-- Soat -->
  <g transform="translate(372 96)">
    <circle r="26" fill="#FFFFFF" filter="url(#softSm)"/>
    <circle r="21" fill="none" stroke="#DBEAFE" stroke-width="2"/>
    <path d="M0 0 V-13 M0 0 L9 5" stroke="#1E3A8A" stroke-width="3" stroke-linecap="round"/>
    <circle r="2.5" fill="#2563EB"/>
  </g>

  <!-- Doska -->
  <g transform="translate(46 120)" filter="url(#soft)">
    <rect width="330" height="236" rx="14" fill="#FFFFFF"/>
    <rect x="0" y="0" width="330" height="40" rx="14" fill="#EFF6FF"/>
    <rect x="0" y="26" width="330" height="14" fill="#EFF6FF"/>
    <circle cx="22" cy="20" r="5" fill="#93C5FD"/>
    <circle cx="38" cy="20" r="5" fill="#BFDBFE"/>
    <rect x="58" y="15" width="110" height="10" rx="5" fill="#BFDBFE"/>
  </g>
  <g transform="translate(46 120)">
    <!-- 7 kunlik progress -->
    <g transform="translate(22 60)">
      <g fill="#2563EB">
        <rect x="0" width="30" height="30" rx="8"/>
        <rect x="38" width="30" height="30" rx="8"/>
        <rect x="76" width="30" height="30" rx="8"/>
        <rect x="114" width="30" height="30" rx="8"/>
        <rect x="152" width="30" height="30" rx="8"/>
        <rect x="190" width="30" height="30" rx="8"/>
      </g>
      <rect x="228" width="30" height="30" rx="8" fill="#DBEAFE"/>
      <g stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 15 l5 5 l9 -10"/><path d="M46 15 l5 5 l9 -10"/><path d="M84 15 l5 5 l9 -10"/>
        <path d="M122 15 l5 5 l9 -10"/><path d="M160 15 l5 5 l9 -10"/><path d="M198 15 l5 5 l9 -10"/>
      </g>
      <text x="243" y="20" font-family="Onest, Arial, sans-serif" font-size="13" font-weight="700" fill="#2563EB" text-anchor="middle">7</text>
    </g>
    <!-- grafik -->
    <g transform="translate(22 112)">
      <rect x="0" y="62" width="22" height="40" rx="5" fill="#BFDBFE"/>
      <rect x="32" y="44" width="22" height="58" rx="5" fill="#93C5FD"/>
      <rect x="64" y="26" width="22" height="76" rx="5" fill="#60A5FA"/>
      <rect x="96" y="6" width="22" height="96" rx="5" fill="#2563EB"/>
      <path d="M2 56 C 40 40, 60 34, 108 0" stroke="#0EA5E9" stroke-width="3" fill="none" stroke-linecap="round"/>
      <circle cx="108" cy="0" r="5" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="3"/>
    </g>
    <!-- ro‘yxat -->
    <g transform="translate(170 118)">
      <rect width="138" height="96" rx="10" fill="#F8FAFF" stroke="#E0EAFF"/>
      <g>
        <circle cx="16" cy="20" r="6" fill="#22C55E"/><rect x="30" y="16" width="90" height="8" rx="4" fill="#CBD5E1"/>
        <circle cx="16" cy="48" r="6" fill="#22C55E"/><rect x="30" y="44" width="72" height="8" rx="4" fill="#CBD5E1"/>
        <circle cx="16" cy="76" r="6" fill="none" stroke="#93C5FD" stroke-width="2.5"/><rect x="30" y="72" width="84" height="8" rx="4" fill="#E2E8F0"/>
      </g>
    </g>
  </g>

  <!-- O‘simlik -->
  <g transform="translate(560 430)">
    <path d="M0 0 C -30 -40, -26 -96, -6 -128 C 4 -90, 8 -50, 0 0 Z" fill="#34D399"/>
    <path d="M2 0 C 30 -30, 46 -80, 34 -116 C 18 -86, 6 -48, 2 0 Z" fill="#10B981"/>
    <path d="M0 0 C -46 -14, -64 -50, -66 -80 C -38 -64, -18 -40, 0 0 Z" fill="#6EE7B7"/>
    <path d="M-30 0 h62 l-8 64 a6 6 0 0 1 -6 5 h-34 a6 6 0 0 1 -6 -5 z" fill="#FFFFFF" filter="url(#softSm)"/>
    <rect x="-30" y="0" width="62" height="10" rx="3" fill="#E0EAFF"/>
  </g>

  <!-- Murabbiy (tik turgan) -->
  <g transform="translate(408 250)">
    <!-- oyoqlar -->
    <rect x="22" y="196" width="22" height="118" rx="10" fill="#1E293B"/>
    <rect x="52" y="196" width="22" height="118" rx="10" fill="#0F172A"/>
    <ellipse cx="33" cy="316" rx="18" ry="7" fill="#0F172A"/>
    <ellipse cx="66" cy="316" rx="18" ry="7" fill="#0F172A"/>
    <!-- tana -->
    <path d="M10 70 Q48 44 86 70 L94 206 Q48 220 4 206 Z" fill="url(#blazer)"/>
    <path d="M38 62 L48 120 L58 62 Z" fill="#FFFFFF"/>
    <path d="M45 72 L48 112 L51 72 Z" fill="#38BDF8"/>
    <!-- chap qo‘l (pastda) -->
    <path d="M86 78 C 104 110, 106 150, 98 186" stroke="url(#blazer)" stroke-width="22" stroke-linecap="round" fill="none"/>
    <circle cx="98" cy="190" r="10" fill="#E8B48F"/>
    <!-- o‘ng qo‘l doskaga ko‘rsatmoqda -->
    <path d="M14 82 C -14 96, -40 92, -62 74" stroke="#1E40AF" stroke-width="22" stroke-linecap="round" fill="none"/>
    <circle cx="-68" cy="70" r="10" fill="#E8B48F"/>
    <path d="M-76 66 L-104 52" stroke="#E8B48F" stroke-width="6" stroke-linecap="round"/>
    <!-- bosh -->
    <rect x="40" y="40" width="16" height="20" rx="6" fill="#E0A982"/>
    <ellipse cx="48" cy="20" rx="26" ry="29" fill="#E8B48F"/>
    <path d="M22 18 C 20 -12, 76 -14, 74 16 C 66 4, 44 0, 22 18 Z" fill="#1F2937"/>
    <circle cx="39" cy="22" r="2.6" fill="#1F2937"/>
    <circle cx="57" cy="22" r="2.6" fill="#1F2937"/>
    <path d="M40 34 Q48 40 56 34" stroke="#9A5B3F" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- planshet -->
    <rect x="86" y="150" width="34" height="46" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" transform="rotate(10 103 173)"/>
  </g>

  <!-- Stol -->
  <g filter="url(#soft)">
    <path d="M30 560 H600 L580 600 H50 Z" fill="url(#desk)"/>
  </g>
  <rect x="50" y="600" width="530" height="12" fill="#DCE6F7"/>
  <rect x="80" y="612" width="14" height="120" rx="4" fill="#CBD8EF"/>
  <rect x="536" y="612" width="14" height="120" rx="4" fill="#CBD8EF"/>

  <!-- Noutbuklar (ekranlari xodimlarga qaragan; xodimlar tomoshabin bilan noutbuk orasida) -->
  <g transform="translate(96 470)">
    <path d="M0 0 H150 a8 8 0 0 1 8 8 V92 H-8 V8 a8 8 0 0 1 8 -8 Z" fill="#1E293B"/>
    <rect x="6" y="6" width="138" height="80" rx="4" fill="url(#screen)"/>
    <rect x="18" y="20" width="70" height="8" rx="4" fill="#FFFFFF" opacity="0.9"/>
    <rect x="18" y="36" width="110" height="6" rx="3" fill="#FFFFFF" opacity="0.5"/>
    <rect x="18" y="48" width="96" height="6" rx="3" fill="#FFFFFF" opacity="0.5"/>
    <rect x="18" y="62" width="44" height="12" rx="6" fill="#FFFFFF"/>
    <path d="M-20 92 H170 L160 102 H-10 Z" fill="#94A3B8"/>
  </g>
  <g transform="translate(372 474)">
    <path d="M0 0 H140 a8 8 0 0 1 8 8 V88 H-8 V8 a8 8 0 0 1 8 -8 Z" fill="#1E293B"/>
    <rect x="6" y="6" width="128" height="76" rx="4" fill="#F8FAFC"/>
    <circle cx="36" cy="44" r="22" fill="none" stroke="#DBEAFE" stroke-width="8"/>
    <path d="M36 22 A22 22 0 1 1 15 50" fill="none" stroke="#2563EB" stroke-width="8" stroke-linecap="round"/>
    <rect x="70" y="28" width="50" height="8" rx="4" fill="#BFDBFE"/>
    <rect x="70" y="42" width="38" height="8" rx="4" fill="#E2E8F0"/>
    <rect x="70" y="56" width="44" height="8" rx="4" fill="#E2E8F0"/>
    <path d="M-20 88 H160 L150 98 H-10 Z" fill="#94A3B8"/>
  </g>
  <!-- O‘tirgan xodimlar (orqadan) -->
  <g transform="translate(230 470)">
    <path d="M-34 96 C -34 40, 34 40, 34 96 Z" fill="url(#shirtA)"/>
    <rect x="-8" y="16" width="16" height="22" rx="6" fill="#D9A07C"/>
    <ellipse cx="0" cy="6" rx="24" ry="26" fill="#3F2A1F"/>
    <path d="M-24 4 C -22 -26, 22 -26, 24 4 C 14 -6, -14 -6, -24 4 Z" fill="#2B1B13"/>
  </g>
  <g transform="translate(330 478)">
    <path d="M-32 88 C -32 36, 32 36, 32 88 Z" fill="url(#shirtB)"/>
    <rect x="-7" y="14" width="14" height="20" rx="6" fill="#E8B48F"/>
    <ellipse cx="0" cy="4" rx="22" ry="24" fill="#111827"/>
    <path d="M-22 6 C -30 30, -26 52, -18 60 L-12 26 Z" fill="#111827"/>
    <path d="M22 6 C 30 30, 26 52, 18 60 L12 26 Z" fill="#111827"/>
  </g>

  <!-- Stol ustidagi buyumlar -->
  <g transform="translate(470 572)">
    <rect x="0" y="-22" width="22" height="24" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <path d="M22 -16 a7 7 0 0 1 0 12" stroke="#CBD5E1" stroke-width="3" fill="none"/>
  </g>
  <g transform="translate(64 566)">
    <rect width="56" height="8" rx="2" fill="#2563EB"/>
    <rect y="-8" width="50" height="8" rx="2" fill="#93C5FD"/>
  </g>
</svg>
